# Fy-api channel smoke example config
#
# Copy this to smoke.local.yaml and set real credentials via environment vars.
# The tool hits /v1/chat/completions using gateway.user_token, so runs are
# billed as real traffic. Keep that user's quota modest as a budget cap.

gateway:
  base_url: "${FY_API_URL:-http://localhost:3000}"

  # Admin credentials are only used for GET /api/channel/ to resolve channel
  # names. Auth is sent as Authorization: <token> with no Bearer prefix plus
  # New-Api-User.
  admin_token: "${FY_API_ADMIN_TOKEN}"
  admin_user_id: "${FY_API_ADMIN_USER_ID}"

  # User API key from /panel/token. Used for real /v1/chat/completions traffic.
  user_token: "${FY_API_USER_TOKEN}"

test:
  concurrency: 4
  reps_per_case: 3
  timeout_seconds: 60
  max_tokens: 64
  stream: true
  non_stream: true

  # Forces requests to the listed channel by appending -{channel_id} to the
  # user token. Requires gateway.user_token to belong to an admin user.
  pin_channel: false

  prompt: "Reply with the single word: pong."

channels:
  - id: 1
    name: OpenAI
    test_models:
      - gpt-4o-mini
  - id: 2
    name: Anthropic
    test_models:
      - claude-3-5-haiku-20241022

export:
  formats:
    - json
    - csv
  output_dir: "benchmark-results"

metrics:
  latency_percentiles: [50, 95, 99]
